<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {%- include head.html -%}
</head>
<body>
  <header class="masthead">
    <div class="shell masthead__inner">
      <a class="masthead__logo" href="{{ '/' | relative_url }}" aria-label="MLambda home">
        <img class="mark" src="{{ '/images/favicon-32x32.svg' | relative_url }}" alt="" width="32" height="32">
        <span class="wordmark">M<span class="wordmark__accent">Lambda</span></span>
      </a>
      {%- include nav.html -%}
    </div>
  </header>

  <main id="content">
    {{ content }}
  </main>

  {%- include footer.html -%}
  <script>
  // The theme switch: light, dark, or as the system; the choice kept in this browser.
  (function () {
    var root = document.documentElement, saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    function mark(t) { document.querySelectorAll("[data-theme-set]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.themeSet === t ? "true" : "false"); }); }
    mark(saved === "light" || saved === "dark" ? saved : "auto");
    document.querySelectorAll("[data-theme-set]").forEach(function (b) {
      b.addEventListener("click", function () {
        var t = b.dataset.themeSet;
        if (t === "auto") { root.removeAttribute("data-theme"); try { localStorage.removeItem("theme"); } catch (e) {} }
        else { root.setAttribute("data-theme", t); try { localStorage.setItem("theme", t); } catch (e) {} }
        mark(t);
      });
    });
  })();
  // The carousels (_includes/carousel.html): slides laid on each other, one shown at a time. Arrows, dots, keys and
  // swipes move it; it turns every six seconds unless the reader prefers less motion, hovers or focuses it.
  (function () {
    var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelectorAll("[data-carousel]").forEach(function (box) {
      var slides = box.querySelectorAll(".carousel__slide"), dots = box.querySelectorAll("[data-dot]");
      var count = box.querySelector("[data-count]"), at = 0, held = false, x0 = null;
      function go(i) {
        at = (i + slides.length) % slides.length;
        slides.forEach(function (s, k) { s.classList.toggle("is-shown", k === at); });
        dots.forEach(function (d, k) { d.setAttribute("aria-selected", k === at ? "true" : "false"); });
        if (count) count.textContent = String(at + 1);
      }
      var prev = box.querySelector("[data-prev]"), next = box.querySelector("[data-next]");
      if (prev) prev.addEventListener("click", function (e) { e.preventDefault(); go(at - 1); });
      if (next) next.addEventListener("click", function (e) { e.preventDefault(); go(at + 1); });
      dots.forEach(function (d) { d.addEventListener("click", function () { go(Number(d.dataset.dot)); }); });
      box.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { go(at + 1); e.preventDefault(); }
        if (e.key === "ArrowLeft") { go(at - 1); e.preventDefault(); }
      });
      box.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; held = true; }, { passive: true });
      box.addEventListener("touchend", function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) > 40) go(at + (dx < 0 ? 1 : -1));
      });
      box.addEventListener("mouseenter", function () { held = true; });
      box.addEventListener("mouseleave", function () { held = false; });
      if (!still && slides.length > 1) window.setInterval(function () { if (!held && !document.hidden) go(at + 1); }, 6000);
    });
  })();
  </script>
</body>
</html>
