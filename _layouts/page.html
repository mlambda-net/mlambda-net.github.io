---
layout: default
---
<div class="shell">
  <header class="page-head">
    {%- if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif -%}
    <h1>{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif -%}
  </header>
  <div class="{% if page.wide %}wide{% else %}prose{% endif %}">
    {{ content }}
  </div>
</div>
