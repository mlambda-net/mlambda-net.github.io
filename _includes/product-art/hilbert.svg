  <rect class="box" x="70" y="46" width="150" height="24" rx="4"/><text class="sub" x="145" y="62" text-anchor="middle">N4 · temporal (LTL)</text>
  <rect class="box" x="70" y="78" width="150" height="24" rx="4"/><text class="sub" x="145" y="94" text-anchor="middle">N3 · modal</text>
  <rect class="box" x="70" y="110" width="150" height="24" rx="4"/><text class="sub" x="145" y="126" text-anchor="middle">N2 · relational (GAT)</text>
