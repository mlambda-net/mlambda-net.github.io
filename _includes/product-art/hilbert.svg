<svg viewBox="0 0 320 180" role="img" aria-label="Hilbert: a formula written in .hb is contracted by einsum and compiled to a C# doorway that runs an ONNX graph" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="pa-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="box box--accent" x="20" y="18" width="280" height="30" rx="4"/><text class="sub" x="160" y="37" text-anchor="middle">fn mul(a, b) ↦ einsum("ij,jk-&gt;ik", a, b)</text>
  <path class="arrow" d="M160 48V70" marker-end="url(#pa-h)"/>
  <rect class="box" x="95" y="74" width="130" height="28" rx="4"/><text class="label" x="160" y="92" text-anchor="middle">Cᵢₖ = Aᵢⱼ Bⱼₖ</text>
  <path class="arrow" d="M130 102L90 126" marker-end="url(#pa-h)"/>
  <path class="arrow" d="M190 102L230 126" marker-end="url(#pa-h)"/>
  <rect class="box" x="20" y="130" width="130" height="34" rx="4"/><text class="sub" x="85" y="145" text-anchor="middle">C# doorway</text><text class="sub" x="85" y="157" text-anchor="middle">Tensor Mul(Tensor, Tensor)</text>
  <rect class="box" x="170" y="130" width="130" height="34" rx="4"/><text class="sub" x="235" y="145" text-anchor="middle">ONNX graph</text><text class="sub" x="235" y="157" text-anchor="middle">Einsum · host or runtime</text>
</svg>
