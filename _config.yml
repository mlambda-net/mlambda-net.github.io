title: MLambda
tagline: Software that is verified before it is built.
description: >-
  MLambda builds one family of software from the compiler up: the Aleph language and its native compiler,
  Hilbert and Shin for mathematics and logic, a tensor engine on the GPU, an actor runtime and an actor-native
  database, BDI agents with a neural engine, Turing for rational software, the tools that prove and deploy it,
  and the services and applications a company runs.
url: "https://www.mlambda.net"
baseurl: ""
lang: en

permalink: pretty

# The products are MLambda.Docs's products/ folder, laid in by script/products.py before the build (never edited
# here): each page at /products/<path>.html, a folder's README at the folder.
collections:
  products:
    output: true
    permalink: /products/:path:output_ext

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - script
  - docs
  - _docs
  - vendor
